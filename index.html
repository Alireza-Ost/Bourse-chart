/* ================= دیده‌بان صنایع =================
   فقط جدول. هر صنعت یک زیرتب، و سیزده ستونش کنار هم.

   داده‌اش در data.json نیست: هر صنعت یک فایل `ind/<کد>.json` دارد که فقط
   با کلیک‌شدن زیرتبش گرفته می‌شود. دلیلش حجم است — چهل‌وهشت صنعت ×
   سیزده سری، اگر همه را داخل data.json می‌ریختیم هر بازکردن صفحه چند
   مگابایت می‌کشید، حتی برای دیدن شاخص کل.

   فایل هر صنعت تُنُک است: `i` فهرست شمارهٔ ردیف روی محور اصلی، و هر سری
   به همان طول. اینجا به آرایهٔ هم‌طولِ محور باز می‌شود و زیر کلید
   `ind_<کد>_<سری>` در DATA می‌نشیند، پس جدول هیچ نمی‌داند که این ستون
   صنعتی است.
   ------------------------------------------------- */
const IND = (DATA.ind && DATA.ind.codes) ? DATA.ind : {dir:null, codes:[], metrics:[]};
const indKey = (c,m) => `ind_${c}_${m}`;
const indLoaded = new Set();
let indBusy = null;

/* انتخاب صنعت کشویی است و داخل نوار بالای خودِ جدول می‌نشیند، کنار
   «برو به تاریخ». نوار چیپ بود و عوض شد: با شصت‌ویک گزینه سه ردیف
   می‌شد و بالای جدول را می‌خورد. */
const indPick = document.getElementById("indPick");
const indPickLabel = document.getElementById("indPickLabel");
/* همان فهرست، این بار بالای نمودار ستونی. دو کشویی جداست چون یکی داخل
   نوار جدول می‌نشیند و دیگری داخل نوار کنترل‌ها؛ مقدارشان هم‌گام می‌شود
   پس عوض‌کردن صنعت در یک تب، تب دیگر را هم همان‌جا نگه می‌دارد. */
const indChartPick = document.getElementById("indChartPick");
const indChartLabel = document.getElementById("indChartLabel");

/* تب‌های صنایع بی‌داده نمایش داده نمی‌شوند — مثل صفحهٔ تک‌فایلیِ محلی که
   نمی‌تواند کنار خودش فایل بخواند. */
const indBlind = !IND.dir || !IND.codes.length;
for(const id of ["ind","indval","flow"]){
  const b = viewsRow.querySelector(`button[data-v="${id}"]`);
  if(b && indBlind) b.hidden = true;
}

IND.codes.forEach(c=>{
  for(const sel of [indPick, indChartPick]){
    const o=document.createElement("option");
    o.value=c.c; o.textContent=c.n;
    o.title=`${c.d} روز · ${c.f} تا ${c.l}`;
    sel.appendChild(o);
  }
});
indPick.addEventListener("change", ()=>pickInd(indPick.value));
indChartPick.addEventListener("change", ()=>{
  state.ind = String(indChartPick.value);
  ensureIndChart();
});

function indChipState(){
  if(state.ind){ indPick.value = state.ind; indChartPick.value = state.ind; }
}

/* ستون‌های جدولِ صنعتِ انتخاب‌شده. ستونی که داده‌اش نیامده هم می‌ماند و
   «—» نشان می‌دهد: شش سری (سفارش‌ها، برآیند، بازدهی، درصدها) فقط از
   برداشت روزانه می‌آیند و در اکسلِ تاریخچه نیستند، پس تا امروز خالی‌اند.
   حذفشان یعنی ستون‌ها بین صنایع جابه‌جا شوند. */
function indCols(){
  if(!state.ind) return [];
  return IND.metrics.map(m=>({k:indKey(state.ind,m.k), n:m.n, u:m.u, dec:m.dec}));
}

/* فقط روزهایی که این صنعت داده دارد، جدیدترین بالا. بی این فیلتر جدول
   هشت هزار ردیف می‌شود که بیشترش خالی است. */
function indRows(){
  if(!state.ind) return [];
  const keys = IND.metrics.map(m=>DATA[indKey(state.ind,m.k)]).filter(Boolean);
  if(!keys.length) return [];
  const out=[];
  for(let i=N-1;i>=0;i--){
    for(const a of keys){ if(a[i]!=null){ out.push(i); break; } }
  }
  return out;
}

const titleEl = document.getElementById("title");

/* فایل صنعت را می‌گیرد و به ستون‌های هم‌طولِ محور باز می‌کند. */
function loadInd(code){
  code = String(code);
  if(indLoaded.has(code)) return Promise.resolve(true);
  if(indBusy===code) return Promise.resolve(false);
  indBusy=code;
  return fetch(`${IND.dir}/${code}.json?v=${DATA.d[DATA.d.length-1]}`)
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{
      const idx=j.i||[];
      IND.metrics.forEach(m=>{
        const col=j[m.k];
        if(!col) return;
        const a=new Array(N).fill(null);
        for(let p=0;p<idx.length;p++){
          const i=idx[p];
          if(i>=0 && i<N) a[i]=col[p];
        }
        DATA[indKey(code,m.k)]=a;
      });
      indLoaded.add(code); indBusy=null;
      return true;
    })
    .catch(e=>{
      indBusy=null;
      titleEl.textContent = `صنایع — دادهٔ این صنعت نیامد (${e.message})`;
      return false;
    });
}

function showInd(code){
  state.ind = code;
  const c = IND.codes.find(x=>x.c===code);
  titleEl.textContent = c ? `صنایع — ${c.n}` : "دیده‌بان صنایع";
  scrollEl.scrollTop = 0;
  indChipState();
  renderSheet();
}

function pickInd(code){
  code = String(code);
  if(indLoaded.has(code)){ showInd(code); return; }
  titleEl.textContent = "صنایع — در حال گرفتن داده…";
  loadInd(code).then(okq=>{ if(okq) showInd(code); });
}

/* اولین بار صنعت اول، بارهای بعد همان صنعتی که قبلاً می‌دیدید. */
function ensureInd(){
  if(!IND.codes.length) return;
  pickInd(state.ind || IND.codes[0].c);
}

/* ---- نمودار ستونیِ ارزش معاملات صنعت ----
   سریِ بیرونی `ind_<کد>_value` و درونی `ind_<کد>_flow`؛ هر دو از همان
   فایلی می‌آیند که جدول صنایع هم از آن می‌خورد، پس عوض‌کردن تب چیزی را
   دوباره نمی‌گیرد. */
function indTitle(){
  const c = IND.codes.find(x=>String(x.c)===String(state.ind));
  return c ? `ارزش معاملات — ${c.n}` : "ارزش معاملات صنایع";
}

function applyIndChart(){
  state.key = indKey(state.ind, "value");
  state.compare=[state.key]; state.cmpMode=false;
  indChipState();
  /* بازهٔ پیش‌فرض یک سال، مثل بقیهٔ نماهای تک‌سری. برای صنعتی که فقط
     چند ماه داده دارد، applyRange خودش تا آخرین روزِ دارای داده عقب
     می‌آید. */
  applyRange(250); markRange(3);
  syncChips(); syncMaRow(); syncRsiRow(); syncOvRow(); draw();
}

function ensureIndChart(){
  if(!IND.codes.length) return;
  const code = String(state.ind || IND.codes[0].c);
  state.ind = code;
  if(indLoaded.has(code)){ applyIndChart(); return; }
  titleEl.textContent = "ارزش معاملات — در حال گرفتن داده…";
  loadInd(code).then(ok=>{ if(ok) applyIndChart(); });
}

/* قالب وب کل این فایل را داخل یک تابع می‌پیچد، پس از کنسول مرورگر (و از
   تست‌های خودکار) هیچ‌کدام از این‌ها دیده نمی‌شد. چیز تازه‌ای لو نمی‌دهد —
   همهٔ داده‌اش همان data.json کنار صفحه است. */
window.__dbg = {state, DATA, FRAMES, plan, view, fa, frame, IND};

/* ---------- راه‌اندازی ---------- */
new ResizeObserver(resize).observe(stage);
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{syncChips();draw();});
new MutationObserver(()=>{syncChips();draw();}).observe(
  document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
document.fonts?.ready?.then(draw);
state.compare=[state.key];
syncChips();
syncMaRow();
syncRsiRow();
syncOvRow();
resize();


/* ================= جمع ورود پول بین دو تاریخ =================

   چرا یک تبِ جداگانه و نه یک عدد گوشهٔ نمودار: سؤال «از اول مهر تا
   حالا چقدر پول حقیقی وارد شد» روی نمودار فقط برای کل بازار جا
   می‌شود، در حالی که همان سؤال برای هر صنعت و هر سبد صندوق هم
   پرسیده می‌شود.

   سه بخشِ مستقل، نه یک فهرستِ درهم: کل بازار، صنایع، صندوق‌ها. هیچ‌کدام
   قرار نیست جمعِ دیگری باشد — هر کدام جمعِ خودش در همان بازه است. اولین
   نسخه هر سه را در یک جدول ریخته بود و شبیه یک تفکیکِ کل بازار دیده
   می‌شد؛ نبود. */

const flowEl    = document.getElementById("flow");
const flowFrom  = document.getElementById("flowFrom");
const flowTo    = document.getElementById("flowTo");
const flowQuick = document.getElementById("flowQuick");
const flowCount = document.getElementById("flowCount");
const flowCards = document.getElementById("flowCards");
const flowNote  = document.getElementById("flowNote");
const flowTables= document.getElementById("flowTables");
const flowCsvBtn= document.getElementById("flowCsv");

/* کارت بالا فقط یکی است: کل بازار. صندوق‌ها جدول خودشان را دارند و
   تکرارشان این‌جا همان درهم‌ریختگیِ نسخهٔ اول را برمی‌گرداند. */
const FLOW_MARKET = [
  {k:"flow_retail", n:"کل بازار", s:"سهام، حق تقدم و صندوق سهامی"},
];

/* کد صنعت عددی است و کد سبد صندوق نه — همین تفکیکشان می‌کند. */
const isFundCode = c => !/^\d+$/.test(String(c));

/* دکمه‌های میان‌بر. عددها «روز معاملاتی»اند نه روز تقویمی، چون محور
   همین است: ۲۲ روز معاملاتی ≈ یک ماه. */
const FLOW_QUICK = [
  {n:"۱م", d:22}, {n:"۳م", d:64}, {n:"۶م", d:128}, {n:"۱س", d:250},
  {n:"از ابتدای سال", ytd:true}, {n:"همه", all:true},
];

let FLOW = null;            // {کد صنعت: {i:[ردیف محور], f:[ورود پول]}}
let flowState = "cold";     // cold | loading | ready | error
let flowErrMsg = "";

const HEMAT = 1000;         // ۱ همت = ۱۰۰۰ میلیارد تومان

const normJ = s => {
  const t = String(s||"").replace(/[^0-9۰-۹٠-٩]/g, "")
    .replace(/[۰-۹]/g, c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c))
    .replace(/[٠-٩]/g, c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c));
  return t.length===8 ? t : "";
};

/* بازهٔ انتخاب‌شده به شمارهٔ ردیف روی محور. تاریخی که روز معاملاتی نبوده
   به نزدیک‌ترین روزِ *داخل* بازه می‌چسبد، نه بیرونش. */
function flowRange(){
  const a = normJ(flowFrom.value), b = normJ(flowTo.value);
  let i0 = 0, i1 = N-1;
  if(a){ i0 = DATA.d.findIndex(d => d >= a); if(i0 < 0) i0 = N; }
  if(b){ i1 = -1; for(let i=N-1;i>=0;i--){ if(DATA.d[i] <= b){ i1 = i; break; } } }
  return {i0, i1, ok: i0 <= i1 && i0 < N && i1 >= 0};
}

function setFlowRange(i0, i1){
  flowFrom.value = DATA.d[Math.max(0, Math.min(N-1, i0))];
  flowTo.value   = DATA.d[Math.max(0, Math.min(N-1, i1))];
}

function sumSeries(arr, i0, i1){
  let s = 0, n = 0;
  if(!arr) return {s:null, n:0};
  for(let i=i0;i<=i1;i++){
    const v = arr[i];
    if(v==null || Number.isNaN(v)) continue;
    s += v; n++;
  }
  return {s: n ? s : null, n};
}

/* جمع یک صنعت از همان آرایهٔ تُنُک — بدون باز کردنش روی کل محور. */
function sumInd(code, i0, i1){
  const o = FLOW && FLOW[code];
  if(!o) return {s:null, n:0};
  let s = 0, n = 0;
  for(let p=0;p<o.i.length;p++){
    const i = o.i[p];
    if(i < i0) continue;
    if(i > i1) break;
    s += o.f[p]; n++;
  }
  return {s: n ? s : null, n};
}

const flowSign = v => v==null ? "" : (v > 0 ? "pos" : (v < 0 ? "neg" : ""));

function flowBig(v){
  if(v==null) return "—";
  return nice(v, Math.abs(v) >= 100 ? 0 : 1);
}

function ensureFlow(){
  if(flowState === "ready"){ renderFlow(); return; }
  if(flowState === "loading") return;
  if(!IND.flow){ flowState = "error"; flowErrMsg = "فهرست صنایع در این نسخه نیست."; renderFlow(); return; }
  flowState = "loading";
  renderFlow();
  fetch(`${IND.flow}?v=${DATA.d[N-1]}`)
    .then(r => { if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j => { FLOW = j; flowState = "ready"; renderFlow(); })
    .catch(e => { flowState = "error"; flowErrMsg = e.message; renderFlow(); });
}

function renderFlow(){
  const R = flowRange();
  if(!R.ok){
    flowCount.textContent = "بازه خالی است";
    flowCards.innerHTML = ""; flowTables.innerHTML = "";
    flowNote.textContent = "تاریخ شروع باید پیش از تاریخ پایان باشد.";
    return;
  }
  const {i0, i1} = R;
  flowCount.textContent =
    `${jDate(DATA.d[i0])} تا ${jDate(DATA.d[i1])} · ${fmt(i1-i0+1,0)} روز معاملاتی`;

  const full = i1 - i0 + 1;

  /* کارت بالا: کل بازار */
  flowCards.innerHTML = FLOW_MARKET.map(m => {
    const {s, n} = sumSeries(DATA[m.k], i0, i1);
    const hem = (s!=null && Math.abs(s) >= HEMAT)
      ? ` · ${nice(s/HEMAT, 1)} همت` : "";
    return `<div class="flow-card">
      <div class="k">${m.n} — ${m.s}</div>
      <div class="v ${flowSign(s)}">${flowBig(s)}<span class="u">میلیارد تومان</span></div>
      <div class="s">${n ? fmt(n,0)+" روز داده از "+fmt(full,0)+hem : "داده‌ای در این بازه نیست"}</div>
    </div>`;
  }).join("");

  if(flowState === "loading"){
    flowNote.textContent = "صنایع و صندوق‌ها در حال آمدن است…";
    flowTables.innerHTML = "";
    return;
  }
  if(flowState === "error"){
    flowNote.textContent = `صنایع و صندوق‌ها نیامدند (${flowErrMsg}).`;
    flowTables.innerHTML = "";
    return;
  }

  flowNote.textContent = "هر عدد، جمعِ خودِ آن ردیف در همین بازه است — "
    + "نه سهمی از کل بازار. سه بخش مستقل‌اند و جمعشان روی هم معنی ندارد.";

  const all = IND.codes.map(c => {
    const {s, n} = sumInd(String(c.c), i0, i1);
    return {c:String(c.c), n:c.n, s, days:n};
  }).filter(r => r.s != null);

  flowTables.innerHTML =
      flowTable("صنایع", all.filter(r => !isFundCode(r.c)), full)
    + flowTable("صندوق‌ها", all.filter(r =>  isFundCode(r.c)), full);
}

/* یک جدول برای یک دسته. مقیاس میله در هر جدول از بزرگ‌ترینِ *همان*
   دسته می‌آید: اگر مشترک بود، صندوق طلا همهٔ صنعت‌ها را صاف می‌کرد. */
function flowTable(title, rows, full){
  if(!rows.length){
    return `<div class="flow-head">${title}</div>`
      + `<div class="flow-note">در این بازه داده‌ای ندارد.</div>`;
  }
  rows = rows.slice().sort((a,b) => b.s - a.s);
  const max = rows.reduce((a,r)=>Math.max(a, Math.abs(r.s)), 0) || 1;
  const body = rows.map(r => {
    const w = Math.abs(r.s) / max * 50;
    /* میلهٔ دوطرفه: خط صفر وسط، مثبت یک طرف و منفی طرف دیگر، تا بدون
       خواندن عدد هم معلوم باشد کدام پول گرفته و کدام داده. */
    const side = r.s >= 0
      ? `inset-inline-start:50%; width:${w}%; background:var(--up)`
      : `inset-inline-end:50%; width:${w}%; background:var(--down)`;
    const short = r.days < full;
    return `<tr>
      <td>${r.n}</td>
      <td class="${flowSign(r.s)}">${flowBig(r.s)}</td>
      <td class="bar"><div class="bar-wrap"><span class="zero" style="inset-inline-start:50%"></span><i style="${side}"></i></div></td>
      <td class="${short ? "none" : ""}"${short
        ? ` title="فقط ${fmt(r.days,0)} روز از ${fmt(full,0)} روزِ بازه داده دارد."` : ""
        }>${fmt(r.days,0)}</td></tr>`;
  }).join("");
  return `<div class="flow-head">${title}<span>${fmt(rows.length,0)} ردیف</span></div>`
    + `<table><thead><tr>
        <th>${title === "صندوق‌ها" ? "سبد صندوق" : "صنعت"}</th>
        <th>مجموع ورود پول حقیقی<span class="unit">میلیارد تومان</span></th>
        <th>اندازه نسبت به بزرگ‌ترینِ همین بخش</th>
        <th>روز داده<span class="unit">از ${fmt(full,0)} روز بازه</span></th>
      </tr></thead><tbody>${body}</tbody></table>`;
}

FLOW_QUICK.forEach(q => {
  const b = document.createElement("button");
  b.textContent = q.n;
  b.addEventListener("click", () => {
    if(q.all) setFlowRange(0, N-1);
    else if(q.ytd){
      const y = DATA.d[N-1].slice(0,4);
      let i = DATA.d.findIndex(d => d.slice(0,4) === y);
      setFlowRange(i < 0 ? 0 : i, N-1);
    } else setFlowRange(N-q.d, N-1);
    renderFlow();
  });
  flowQuick.appendChild(b);
});

for(const el of [flowFrom, flowTo]){
  el.addEventListener("change", renderFlow);
  el.addEventListener("keydown", e => { if(e.key === "Enter") renderFlow(); });
}

flowCsvBtn.addEventListener("click", () => {
  const R = flowRange();
  if(!R.ok) return;
  const {i0, i1} = R;
  const lines = ["بخش,نام,مجموع ورود پول حقیقی (میلیارد تومان),روز داده"];
  for(const m of FLOW_MARKET){
    const {s, n} = sumSeries(DATA[m.k], i0, i1);
    lines.push(`کل بازار,${m.n},${s==null?"":s.toFixed(1)},${n}`);
  }
  if(flowState === "ready"){
    for(const c of IND.codes){
      const {s, n} = sumInd(String(c.c), i0, i1);
      if(s == null) continue;
      lines.push(`${isFundCode(c.c) ? "صندوق‌ها" : "صنایع"},${c.n},${s.toFixed(1)},${n}`);
    }
  }
  saveCsv(`bourse_flow_${DATA.d[i0]}_${DATA.d[i1]}.csv`, "﻿" + lines.join("\n"));
});

/* بازهٔ پیش‌فرض: یک ماه معاملاتی. */
setFlowRange(N-22, N-1);

/* برای تست‌های خودکار: همان توابع جمع، بدون عبور از DOM. */
window.__dbg.flow = {
  range: flowRange, setRange: setFlowRange, render: renderFlow,
  sumSeries, sumInd, ensure: ensureFlow,
  get data(){ return FLOW; }, get status(){ return flowState; },
};

};
function load(){
document.getElementById('boot').hidden=false;
fetch('data.json?v='+Date.now())
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(d){ document.getElementById('boot').remove(); document.getElementById('appwrap').hidden=false; window.__boot(d); })
  .catch(function(e){ document.getElementById('boot').textContent='داده بارگذاری نشد ('+e.message+'). مطمئن شوید data.json کنار همین صفحه است.'; });
}
</script>
<div id='gate' hidden style="position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg,#faf9f5);font-family:Vazirmatn,system-ui,sans-serif"><form id='gateForm' style="display:flex;flex-direction:column;gap:14px;width:min(320px,86vw);text-align:center"><div style="font-size:17px;font-weight:700;color:var(--ink,#201f1c)">بورس تهران</div><div id='gateMsg' style="font-size:13px;color:var(--muted,#82857a)">کد ورود را وارد کنید</div><input id='gateIn' type='password' inputmode='numeric' autocomplete='off' style="padding:11px 14px;border:1px solid var(--line,#e5e3dc);border-radius:9px;background:var(--surface,#fff);color:var(--ink,#201f1c);font:inherit;font-size:16px;text-align:center;letter-spacing:3px"><button type='submit' style="padding:11px;border:0;border-radius:9px;background:var(--ink,#201f1c);color:var(--bg,#faf9f5);font:inherit;font-weight:600;cursor:pointer">ورود</button></form></div>
<script>
var GATE="e98a436b14e9624eaa8520e527aa8823c2a2ee867c641658b9bb2870e96e75f8";
/* SHA-256 خالص، چون crypto.subtle روی file:// در دسترس نیست */
function sha256(a){function b(x,n){return x>>>n|x<<32-n}var k=[],h=[],p=2,i,j,r;
for(i=0;i<64;){for(j=2,r=1;j*j<=p;j++)if(p%j==0){r=0;break}
if(r){if(i<8)h[i]=(Math.pow(p,.5)%1*4294967296)|0;k[i]=(Math.pow(p,1/3)%1*4294967296)|0;i++}p++}
var m=[],u=unescape(encodeURIComponent(a)),L=u.length;
for(i=0;i<L;i++)m[i>>2]|=(u.charCodeAt(i)&255)<<24-(i%4)*8;
m[L>>2]|=128<<24-(L%4)*8;m[((L+8>>6)+1<<4)-1]=L*8;
var w=[],s,t1,t2,A,B,C,D,E,F,G,H;
for(i=0;i<m.length;i+=16){A=h[0];B=h[1];C=h[2];D=h[3];E=h[4];F=h[5];G=h[6];H=h[7];
for(j=0;j<64;j++){if(j<16)w[j]=m[i+j]|0;else{var g0=b(w[j-15],7)^b(w[j-15],18)^w[j-15]>>>3,
g1=b(w[j-2],17)^b(w[j-2],19)^w[j-2]>>>10;w[j]=w[j-16]+g0+w[j-7]+g1|0}
t1=H+(b(E,6)^b(E,11)^b(E,25))+(E&F^~E&G)+k[j]+w[j]|0;
t2=(b(A,2)^b(A,13)^b(A,22))+(A&B^A&C^B&C)|0;
H=G;G=F;F=E;E=D+t1|0;D=C;C=B;B=A;A=t1+t2|0}
h[0]=h[0]+A|0;h[1]=h[1]+B|0;h[2]=h[2]+C|0;h[3]=h[3]+D|0;
h[4]=h[4]+E|0;h[5]=h[5]+F|0;h[6]=h[6]+G|0;h[7]=h[7]+H|0}
for(s='',i=0;i<8;i++)s+=('00000000'+(h[i]>>>0).toString(16)).slice(-8);return s}
var gate=document.getElementById('gate');
function remember(v){try{localStorage.setItem('gate',v)}catch(e){}}
function remembered(){try{return localStorage.getItem('gate')}catch(e){return null}}
function unlock(){gate.remove();load()}
if(!GATE||GATE.indexOf('_')===0){ load(); }
else if(remembered()===GATE){ unlock(); }
else{ gate.hidden=false; document.getElementById('gateIn').focus();
  document.getElementById('gateForm').addEventListener('submit',function(e){
    e.preventDefault();
    var el=document.getElementById('gateIn');
    if(sha256(el.value.trim())===GATE){ remember(GATE); unlock(); }
    else{ document.getElementById('gateMsg').textContent='کد درست نیست.';
          document.getElementById('gateMsg').style.color='#d4443a';
          el.value=''; el.focus(); }
  });
}
</script>
